# Simpele GitLab CI/CD pipeline voor schoolproject
# Draait automatisch bij push

image: python:3.10

stages:
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: "$CI_PROJECT_DIR"

test_job:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest tests/test_fout_analyse_service.py -v
