% extends "base.html" %}

{% block title %}Foutenanalyse{% endblock %}

{% block content %}

<div class="fout-dashboard-container">
    
    <!-- PAGINA TITEL -->
    <!-- Hoofdtitel van de foutenanalyse pagina met beschrijving -->
    <div class="fout-dashboard-header">
        <h1 class="fout-dashboard-title">Foutenanalyse</h1>
        <p class="fout-dashboard-subtitle">Inzicht in je meest gemaakte fouten en verbeterpunten</p>
    </div>

    <!-- FILTER SECTIE -->
    <!-- Hiermee kan de leerling fouten filteren per vak -->
    <div class="fout-filter-section">
        <div class="fout-filter-card">
            <h3 class="fout-filter-title">Filter op vak</h3>
            <form method="get" action="{{ url_for('main.fout_analyse') }}" class="fout-filter-form">
                <select name="subject_id" class="fout-filter-select" onchange="this.form.submit()">
                    <option value="">Alle vakken</option>
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}" {% if subject.id == selected_subject_id %}selected{% endif %}>
                            {{ subject.name }}
                        </option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>

    <!-- TOP SECTIE: FOUTENDISTRIBUTIE EN TOP FOUTEN -->
    <!-- Deze sectie toont links de foutendistributie grafiek en rechts de meest gemaakte fouttypes -->
    <div class="fout-dashboard-top-section">

        <!-- LINKER KOLOM: FOUTENDISTRIBUTIE GRAFIEK KAART -->
        <!-- Bevat horizontale bar chart met fouten verdeeld per vak -->
        <div class="fout-dashboard-card fout-chart-card">
            <div class="fout-card-header">
                <h2 class="fout-card-title">Foutendistributie</h2>
            </div>
