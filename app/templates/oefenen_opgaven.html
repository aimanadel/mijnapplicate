{% extends "base.html" %}

{% block title %}Oefenen Opgaven{% endblock %}

{% block content %}
<h1>Welkom bij Oefenen Opgaven</h1>
<!-- Score sectie -->
<p>Score: <span id="score">0</span> / <span id="total">0</span></p>
<!-- Vraag sectie -->
<p id="question"></p>

<!-- Antwoord sectie -->
<input type="text" id="answer" placeholder="Typ hier je antwoord">
<button id="submit">Verzend antwoord</button>
<!-- Feedback sectie -->
<p id="feedback"></p>


<!-- JavaScript sectie -->
<script>
    // Lijst van vragen en antwoorden
    const questions = [
        {text: "Wat is de hoofdstad van Nederland?", answer: "Amsterdam"},
        {text: "Hoeveel dagen heeft een week?", answer: "7"},
        {text: "Welke kleur krijg je door rood en geel te mengen?", answer: "Oranje"},
        {text: "Hoeveel continenten zijn er op aarde?", answer: "7"},
        {text: "Wat is de grootste planeet in ons zonnestelsel?", answer: "Jupiter"},
        {text: "Welke taal spreken ze in Frankrijk?", answer: "Frans"}
    ];
     // Variabelen voor score en voortgang
    let score = 0;           // Aantal juiste antwoorden
    let total = 0;           // Totaal aantal gegeven antwoorden
    let index = 0;           // Huidige vraag index


    // DOM elementen ophalen
    const qElem = document.getElementById("question"); 
    const aElem = document.getElementById("answer");   
    const feedback = document.getElementById("feedback"); 
    const scoreElem = document.getElementById("score");   
    const totalElem = document.getElementById("total");   
        // Functie om de volgende vraag te tonen
    function showQuestion() {
        if(index < questions.length){
            qElem.textContent = questions[index].text; 
            aElem.value = "";                           
            feedback.textContent = "";                  
        } else {
            qElem.textContent = "Alle vragen zijn voltooid!"; 
            aElem.style.display = "none";                      
            document.getElementById("submit").style.display = "none"; 
        }
    }

    // Functie om het antwoord te controleren bij klikken
    document.getElementById("submit").onclick = function(){
        const ans = aElem.value.trim(); 
        total++;                        
        totalElem.textContent = total;  

        if(ans.toLowerCase() === questions[index].answer.toLowerCase()){
            score++;                    
            scoreElem.textContent = score; 
            feedback.textContent = "✅ Correct!"; 
        } else {
            feedback.textContent = "❌ Fout, het juiste antwoord is: " + questions[index].answer; 
        }

        index++;                       
        setTimeout(showQuestion, 1000); 
    }


    // Start eerste vraag v
    showQuestion();
</script>

{% endblock %}
