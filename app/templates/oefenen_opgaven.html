{% extends "base.html" %}

{% block title %}Oefenen Opgaven{% endblock %}

{% block content %}
<!-- Hoofdcontainer van de oefenpagina -->
<div class="oefenen-opgaven">

    <!-- Titel van de pagina -->
    <h1>Welkom bij Oefenen Opgaven</h1>

    <!-- Hier wordt de score getoond (juiste antwoorden / totaal) -->
    <p>Score: <span id="score">0</span> / <span id="total">0</span></p>

    <!-- Hier wordt de vraag getoond -->
    <p id="question"></p>

    <!-- Input veld waar de gebruiker zijn antwoord invult -->
    <input type="text" id="answer" placeholder="Typ hier je antwoord">

    <!-- Knop om het antwoord te controleren -->
    <button id="submit">Verzend antwoord</button>

    <!-- Hier komt feedback (goed of fout) -->
    <p id="feedback"></p>

</div>


<!-- JavaScript sectie -->
<script>
    class Question {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer;
        }

        isCorrect(response) {
            return response.trim().toLowerCase() === this.answer.toLowerCase();
        }

        getFeedback(response) {
            if (this.isCorrect(response)) {
                return {
                    message: "✅ Correct!",
                    correct: true
                };
            }

            return {
                message: `❌ Fout, het juiste antwoord is: ${this.answer}`,
                correct: false
            };
        }
    }

    class Exercise {
        constructor(questionList) {
            this.questions = questionList.map(item => new Question(item.text, item.answer));
            this.score = 0;
            this.total = 0;
            this.index = 0;
            this.incorrectAnswers = [];
        }

        get currentQuestion() {
            return this.questions[this.index];
        }

        get finished() {
            return this.index >= this.questions.length;
        }

        submitAnswer(answer) {
            if (this.finished) {
                return null;
            }

            const result = this.currentQuestion.getFeedback(answer);
            this.total += 1;

            if (result.correct) {
                this.score += 1;
            } else {
                this.incorrectAnswers.push({
                    question: this.currentQuestion.text,
                    expected: this.currentQuestion.answer,
                    given: answer.trim()
                });
            }

            this.index += 1;
            return result;
        }

        getResultPayload() {
            return {
                score: this.score,
                total_answered: this.total,
                incorrect_answers: this.incorrectAnswers
            };
        }
    }

    class ExercisePage {
        constructor(exercise, elements, saveUrl) {
            this.exercise = exercise;
            this.elements = elements;
            this.saveUrl = saveUrl;
            this.elements.submitButton.addEventListener("click", () => this.handleSubmit());
        }

        init() {
            this.showQuestion();
        }

        showQuestion() {
            if (this.exercise.finished) {
                this.finishQuiz();
                return;
            }

            this.elements.question.textContent = this.exercise.currentQuestion.text;
            this.elements.answer.value = "";
            this.elements.feedback.textContent = "";
        }

        updateStats() {
            this.elements.score.textContent = this.exercise.score;
            this.elements.total.textContent = this.exercise.total;
        }

        handleSubmit() {
            if (this.exercise.finished) {
                return;
            }

            const answer = this.elements.answer.value;
            const feedback = this.exercise.submitAnswer(answer);
            this.elements.feedback.textContent = feedback.message;
            this.updateStats();

            setTimeout(() => this.showQuestion(), 1000);
        }

        finishQuiz() {
            this.elements.question.textContent = "Alle vragen zijn voltooid!";
            this.elements.answer.style.display = "none";
            this.elements.submitButton.style.display = "none";
            this.elements.feedback.textContent = "Je hebt de quiz afgerond. Resultaten worden opgeslagen...";
            this.saveResults();
        }

        saveResults() {
            fetch(this.saveUrl, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(this.exercise.getResultPayload())
            }).catch(error => console.error("Fout bij opslaan resultaten:", error));
        }
    }

    const questions = [
        {text: "Wat is de hoofdstad van Nederland?", answer: "Amsterdam"},
        {text: "Hoeveel dagen heeft een week?", answer: "7"},
        {text: "Welke kleur krijg je door rood en geel te mengen?", answer: "Oranje"},
        {text: "Hoeveel continenten zijn er op aarde?", answer: "7"},
        {text: "Wat is de grootste planeet in ons zonnestelsel?", answer: "Jupiter"},
        {text: "Welke taal spreken ze in Frankrijk?", answer: "Frans"}
    ];

    const elements = {
        question: document.getElementById("question"),
        answer: document.getElementById("answer"),
        feedback: document.getElementById("feedback"),
        score: document.getElementById("score"),
        total: document.getElementById("total"),
        submitButton: document.getElementById("submit")
    };

    const exercise = new Exercise(questions);
    const page = new ExercisePage(exercise, elements, "{{ url_for('main.oefenen_opgaven_resultaat') }}");
    page.init();
</script>


{% endblock %}
