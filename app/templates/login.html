<!--
  Template: login.html
  Purpose: Teacher login form
  
  Description:
    Login page for teachers. Accepts username and password.
    Form post to /login route which validates credentials.
  
  Extends: base.html
  
  Form action: POST /login
  Form inputs:
    - username (text): Teacher username
    - password (password): Unencrypted password
  
  Flash messages:
    - "Invalid username or password"
    - "Enter username and password"
    - Error messages from server
  
  Routes:
    - Register link: /register (for new teachers)
-->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <!-- Login form in centered card -->
  <div class="login-card">
    <h1>Login</h1>

    <!-- Show flash messages (errors) if present -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-item">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Login form: POST to /login route -->
    <form method="post" class="login-form">
      <!-- Username input -->
      <label for="username">Username:</label>
      <input 
        id="username" 
        name="username" 
        type="text" 
        placeholder="Your username" 
        required 
      />

      <!-- Password input (masked) -->
      <label for="password">Password:</label>
      <input 
        id="password" 
        name="password" 
        type="password" 
        placeholder="Your password" 
        required 
      />

      <!-- Submit button -->
      <button type="submit">Login</button>
    </form>

    <!-- Link to registration for new teachers -->
    <p style="text-align: center; margin-top: 16px;">
      No account yet? <a href="{{ url_for('main.register') }}">Register here</a>
    </p>
  </div>
{% endblock %}
