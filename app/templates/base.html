<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}ANSW project{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>

    <!-- NAVBAR -->
    <nav class="navbar">
      <ul>
        <li><a href="{{ url_for('main.index') }}">Home</a></li>
        <li><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('events.index') }}">Events</a></li>
        
      </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main">
      <header>
        {% block header %}{% endblock %}
      </header>

      <div>
        {% block content %}{% endblock %}
      </div>
    </div>

    <footer>Developed with ♥️ in Python and Flask</footer>

  </body>
</html>
